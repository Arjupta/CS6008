options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    listen-on { 172.16.2.10; };    
    listen-on-v6 { none; };
    dnssec-validation no;   // turned on in Phase 3
};

zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};

