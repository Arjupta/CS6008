// Phase 7: the Phase 3-6 validating resolver, now ALSO offering DNS over
// TLS on 853 with the certificate make-pki.sh issues (DNS SAN only --
// resolver.cs6008.local, no IP SAN). Plain port 53 is deliberately left
// open too: it's what the permissive client's fallback path (and 7.3's
// attacks ii/iii) exercise on purpose -- the resolver isn't insecure for
// offering it, a CLIENT choosing to fall back to it is the thing under
// test here (see ../README.md).

tls local-tls {
    cert-file "/etc/bind/certs/resolver.crt";
    key-file "/etc/bind/certs/resolver.key";
};

options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    listen-on { 172.16.2.10; 127.0.0.1; };
    listen-on port 853 tls local-tls { 172.16.2.10; };
    listen-on-v6 { none; };
    dnssec-validation yes;   // on from Phase 3 onward, untouched by this phase
};

// Generated by ./sign-zones.sh from the freshly-signed root zone's KSK.
// Not committed to git (see .gitignore) -- regenerate it by running that
// script before `docker compose up`.
include "/etc/bind/trust-anchor.conf";

zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};
