options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    allow-transfer { none; };   // AXFR explicitly blocked -- zone walking is the
                                // only enumeration path this phase allows
    listen-on { 172.16.3.30; 127.0.0.1; };
    listen-on-v6 { none; };
    dnssec-validation no;
};

zone "example.com" {
    type master;
    file "/etc/bind/db.example.com.signed";
};
