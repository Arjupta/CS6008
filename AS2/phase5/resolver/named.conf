options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    listen-on { 172.16.2.10; 127.0.0.1; };
    listen-on-v6 { none; };
    dnssec-validation yes;   // on from Phase 3 onward
};

// Generated by ./sign-zones.sh from the freshly-signed root zone's KSK.
// Not committed to git (see .gitignore) — regenerate it by running that
// script before `docker compose up`.
include "/etc/bind/trust-anchor.conf";

zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};
